  const end=()=>{if(!on)return;on=false;g.classList.remove('on');document.body.classList.remove('rs');try{localStorage.setItem('ll_pw',String(parseInt(getComputedStyle($('#panel')).width)))}catch(e){}};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)})();
</script></body></html>
